name: Video long (YouTube 16:9)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Длина ролика в минутах (1-40)"
        required: false
        default: "6"
      format:
        description: "Формат: doc / breakdown / top10"
        required: false
        default: "doc"
      topic:
        description: "Тема ролика (пусто = по умолчанию)"
        required: false
        default: ""
      script:
        description: "Свой текст/статья (пусто = сценарий пишет LLM)"
        required: false
        default: ""
      from_post:
        description: "Текст поста: GigaChat перепишет его в сценарий (пусто = без рерайта)"
        required: false
        default: ""

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt imageio-ffmpeg edge-tts numpy silero

      - name: Start VoiceStudio (XTTS clone ruslan p-2)
        run: |
          # 1) Стековый torch/torchaudio (CPU)
          echo "⏳ Устанавливаем torch 2.5.1 CPU..."
          pip install --quiet torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu || {
            echo "❌ не удалось поставить torch CPU"; exit 1
          }
          # 2) TTS 0.22.0 + пины
          echo "⏳ Устанавливаем TTS + зависимости..."
          pip install --quiet TTS==0.22.0 'transformers==4.43.3' imageio-ffmpeg numpy==1.26.4 sherpa-onnx || {
            echo "❌ не удалось поставить TTS/sherpa"; exit 1
          }
          # 3) Скачиваем Piper ruslan (~60MB) — голос-донор для клонирования
          echo "⏳ Скачиваем ru_RU-ruslan-medium (~60MB) как голос-донор..."
          mkdir -p models refs
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ru_RU-ruslan-medium.tar.bz2 | tar xj -C models || {
            echo "❌ не удалось скачать модель"; exit 1
          }
          cd models/vits-piper-ru_RU-ruslan-medium
          mv ru_RU-ruslan-medium.onnx model.onnx
          mv ru_RU-ruslan-medium.onnx.json model.onnx.json
          cd ../..
          # 4) Референс голоса: синтез Piper'ом (голос ruslan)
          echo "⏳ Генерируем референс голоса (Piper ruslan)..."
          python - <<'EOF'
          import sherpa_onnx
          cfg = sherpa_onnx.OfflineTtsConfig(
              model=sherpa_onnx.OfflineTtsModelConfig(
                  vits=sherpa_onnx.OfflineTtsVitsModelConfig(
                      model="models/vits-piper-ru_RU-ruslan-medium/model.onnx",
                      tokens="models/vits-piper-ru_RU-ruslan-medium/tokens.txt",
                      lexicon="",
                      data_dir="models/vits-piper-ru_RU-ruslan-medium/espeak-ng-data",
                      dict_dir="",
                  ),
                  num_threads=4,
                  debug=False,
              ),
              rule_fsts="",
              max_num_sentences=1,
          )
          tts = sherpa_onnx.OfflineTts(cfg)
          res = tts.generate("Это голос для клонирования. Он должен звучать естественно и уверенно.", sid=0, speed=0.9)
          import numpy as np, wave
          pcm = (np.asarray(res.samples, dtype=np.float32).clip(-1, 1) * 32767).astype(np.int16)
          with wave.open("refs/ruslan.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(tts.sample_rate)
              w.writeframes(pcm.tobytes())
          print("ref bytes:", len(pcm.tobytes()))
          EOF
          ls -la refs/
          # 5) Запускаем XTTS-сервер (клон ruslan, питч -2)
          echo "⏳ Запускаем tts_server_xtts.py..."
          nohup python bot/tts_server_xtts.py --ref-audio refs/ruslan.wav --pitch -2 --port 3900 \
            > out_tts_server.log 2>&1 &
          echo "⏳ Ждём HTTP-сервер (XTTS грузится ~1 мин)..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3900/health > /dev/null 2>&1; then
              echo "✅ TTS-сервер готов (${i}x5 сек)"
              break
            fi
            sleep 5
          done
          curl -sf http://localhost:3900/health || {
            echo "❌ TTS-сервер не поднялся за 7.5 мин. Лог:"
            cat out_tts_server.log
            exit 1
          }
          echo "⏳ Тест синтеза (короткая фраза)..."
          curl -s -X POST http://localhost:3900/v1/audio/speech \
            -H "Content-Type: application/json" \
            -d '{"model":"tts-1","voice":"alloy","input":"Привет, это тест озвучки","response_format":"wav"}' \
            -o out_tts_test.wav --max-time 180
          ls -la out_tts_test.wav

      - name: Generate long video
        env:
          SCRIPT_TEXT: ${{ github.event.inputs.script }}
          POST_TEXT: ${{ github.event.inputs.from_post }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          TTS_PROVIDER: voicestudio
          VOICESTUDIO_URL: http://localhost:3900/v1
          VOICESTUDIO_VOICE: alloy
          VOICESTUDIO_TIMEOUT: "900"
        run: |
          EXTRA=""
          if [ -n "$SCRIPT_TEXT" ]; then
            printf '%s' "$SCRIPT_TEXT" > script.txt
            EXTRA="--script-file script.txt"
          fi
          if [ -n "$POST_TEXT" ]; then
            printf '%s' "$POST_TEXT" > post.txt
            EXTRA="--from-post post.txt"
          fi
          python bot/video_long.py --topic "${{ github.event.inputs.topic }}" \
            --minutes "${{ github.event.inputs.minutes }}" \
            --format "${{ github.event.inputs.format }}" \
            --out out/video_long.mp4 $EXTRA

      - name: Upload video + EDL + SRT
        uses: actions/upload-artifact@v4
        with:
          name: video-long
          path: |
            out/video_long.mp4
            out/video_long.edl.json
            out/video_long.srt
          retention-days: 14

      - name: Send video to Telegram
        if: success()
        run: |
          CAPTION="🎬 Длинное видео готово (${{ github.event.inputs.minutes }} мин, ${{ github.event.inputs.format }}, run ${{ github.run_id }})${{ github.event.inputs.script != '' && ' — по статье' || '' }}${{ github.event.inputs.from_post != '' && ' — по посту' || '' }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
            -F video="@out/video_long.mp4" \
            -F supports_streaming=true \
            -F caption="$CAPTION"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
            -F document="@out/video_long.edl.json" \
            -F caption="🧩 Монтажный лист (EDL): правь текст/порядок и пересобирай через --edl-in"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
            -F document="@out/video_long.srt" \
            -F caption="💬 Субтитры (SRT)"

      - name: Stop VoiceStudio
        if: always()
        run: |
          echo "=== TTS-сервер лог перед остановкой ==="
          cat out_tts_server.log 2>/dev/null || true
          pkill -f "tts_server" || true

      - name: Notify failure to Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_ADMIN_CHAT_ID}\",\"text\":\"❌ Длинное видео не собралось (run ${{ github.run_id }}). Смотри лог в Actions → Video long.\"}"
