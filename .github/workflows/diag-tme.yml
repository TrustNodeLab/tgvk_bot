name: diag-tme
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests -q
      - name: Probe t.me and cdn from runner
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'EOF'
          import requests
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36",
               "Accept-Language": "en-US,en;q=0.9"}
          r = requests.get("https://t.me/s/aiartcommunity", headers=H, timeout=10)
          print("t.me status:", r.status_code, "len:", len(r.text))
          # extract cdn link
          import re
          m = re.findall(r'https://cdn[0-9]+\.telesco\.pe/file/[A-Za-z0-9_-]+', r.text)
          print("cdn links found:", len(m))
          if m:
              ir = requests.get(m[0], headers=H, timeout=10)
              print("cdn status:", ir.status_code, "bytes:", len(ir.content))
          # another channel
          r2 = requests.get("https://t.me/s/neuralart", headers=H, timeout=10)
          print("neuralart:", r2.status_code, "len:", len(r2.text))
          EOF