name: diag-tme
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Print effective mg_config from KV
        env:
          BOT_WORKER_URL: ${{ secrets.BOT_WORKER_URL }}
          BOT_WORKER_TOKEN: ${{ secrets.BOT_WORKER_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'EOF'
          import sys, os
          sys.path.insert(0, 'bot'); os.chdir('bot')
          import multigroups as mg
          cfg = mg.load_mg_config()
          print("EFFECTIVE_CHANNELS:", cfg.get("channels"))
          print("EFFECTIVE_WINDOWS:", cfg.get("windows"))
          # raw KV read
          raw = mg._kv_get(mg.MG_CONFIG_KEY)
          print("RAW_MG_CONFIG:", raw)
          EOF