name: VK photo diag

on:
  workflow_dispatch:
    inputs:
      group_id:
        description: 'VK group id to test'
        required: false
        default: '226242897'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run diag
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          DIAG_GROUP_ID: ${{ github.event.inputs.group_id }}
        run: python bot/diag_photo.py