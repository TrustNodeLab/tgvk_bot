name: diag-tme
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run mg_tick exactly like prod
        env:
          VK_TOKEN_LOSTART: ${{ secrets.VK_TOKEN_LOSTART }}
          VK_TOKEN_DGC: ${{ secrets.VK_TOKEN_DGC }}
          VK_TOKEN_LOSTLINK: ${{ secrets.VK_TOKEN_LOSTLINK }}
          BOT_WORKER_URL: ${{ secrets.BOT_WORKER_URL }}
          BOT_WORKER_TOKEN: ${{ secrets.BOT_WORKER_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'EOF'
          import sys, os
          sys.path.insert(0, 'bot'); os.chdir('bot')
          import multigroups as mg
          print("TOKEN_LOSTART set:", bool(os.environ.get('VK_TOKEN_LOSTART')))
          res = mg.mg_tick()
          print("MG_TICK_RESULT:", res)
          print("SUMMARY:", mg.mg_summary(res).replace(chr(10), " | "))
          EOF