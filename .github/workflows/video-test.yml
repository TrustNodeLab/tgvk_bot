name: Video test (futuristic site)

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Длина видео в секундах (демо-режим; со сценарием длина = длина озвучки)"
        required: false
        default: "30"
      script:
        description: "Свой сценарий: текст/статья (пусто = демо). Разделы через '# Заголовок'"
        required: false
        default: ""
      style:
        description: "Стиль: default (скролл сайта) или cybersecurity_cinematic / cinematic / documentary / social_dynamic"
        required: false
        default: "default"
      topic:
        description: "Тема cinematic-ролика (только для engine=cine; пусто = тема по умолчанию)"
        required: false
        default: ""
      from_post:
        description: "Текст поста: GigaChat перепишет его в сценарий видео (пусто = без рерайта)"
        required: false
        default: ""

jobs:
  video:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt imageio-ffmpeg edge-tts numpy silero

      # S34: VoiceStudio — локальный Docker TTS-сервер.
      # GPU нет → CPU-режим.
      # S34c-факт: GGUF-бинарь НЕ входит в docker-образ (zero-byte placeholder)
      #   → omnivoice-gguf даёт 503. OmniVoice full — OOM на 7GB RAM.
      # S34d: используем движок Sherpa-ONNX (CPU) + русская Piper-модель
      #   ru_RU-dmitri-medium (~60MB, официальные GH releases k2-fsa/sherpa-onnx).
      - name: Start VoiceStudio
        run: |
          docker run -d --name voicestudio -p 3900:3900 \
            -e OMNIVOICE_TTS_BACKEND=sherpa-onnx \
            -e OMNIVOICE_DEVICE=cpu \
            -e OMNIVOICE_SHERPA_MODEL=/models/vits-piper-ru_RU-dmitri-medium \
            -v voicestudio-models:/models \
            palashdeb/omnivoice-studio:stable
          echo "⏳ Ждём HTTP-сервер VoiceStudio..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3900/health > /dev/null 2>&1; then
              echo "✅ HTTP готов (${i}x5 сек)"
              break
            fi
            sleep 5
          done
          curl -sf http://localhost:3900/health || {
            echo "❌ VoiceStudio HTTP не поднялся за 5 мин. Логи:"
            docker logs voicestudio --tail 60
            exit 1
          }
          # Устанавливаем движок sherpa-onnx ВНУТРЬ контейнера (в образе его нет)
          echo "⏳ pip install sherpa-onnx (нужен кодек движка)..."
          docker exec voicestudio sh -c \
            'PY=$(command -v python3 || command -v python || ls /app/.venv/bin/python 2>/dev/null | head -1); \
             echo "python: $PY"; $PY -m pip install --no-cache-dir --quiet sherpa-onnx' 2>&1 || {
            echo "❌ не удалось поставить sherpa-onnx. Логи:"
            docker logs voicestudio --tail 60
            exit 1
          }
          # Скачиваем русскую модель Piper и кладём в volume /models
          echo "⏳ Скачиваем ru_RU-dmitri-medium (~60MB)..."
          docker exec voicestudio sh -c 'cd /models && curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ru_RU-dmitri-medium.tar.bz2 | tar xj' || {
            echo "❌ не удалось скачать модель. Логи:"
            docker logs voicestudio --tail 60
            exit 1
          }
          ls -la /models/vits-piper-ru_RU-dmitri-medium 2>/dev/null || \
            docker exec voicestudio ls -la /models/vits-piper-ru_RU-dmitri-medium
          echo "=== Engines (sherpa-onnx должен быть available) ==="
          curl -sf http://localhost:3900/engines | head -c 1500 || true
          # контейнеру нужно перечитать бэкенды — рестарт с теми же env
          docker restart voicestudio
          echo "⏳ Ждём после рестарта..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3900/health > /dev/null 2>&1; then
              echo "✅ VoiceStudio с sherpa-onnx готов (${i}x5 сек)"
              break
            fi
            sleep 5
          done
          curl -sf http://localhost:3900/health || {
            echo "❌ VoiceStudio не поднялся после рестарта. Логи:"
            docker logs voicestudio --tail 60
            exit 1
          }

      - name: Generate video
        env:
          SCRIPT_TEXT: ${{ github.event.inputs.script }}
          VIDEO_STYLE: ${{ github.event.inputs.style }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
          POST_TEXT: ${{ github.event.inputs.from_post }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          TTS_PROVIDER: voicestudio
          VOICESTUDIO_URL: http://localhost:3900/v1
          VOICESTUDIO_VOICE: alloy
          VOICESTUDIO_TIMEOUT: "620"
        run: |
          EXTRA=""
          if [ -n "$SCRIPT_TEXT" ]; then
            printf '%s' "$SCRIPT_TEXT" > script.txt
            EXTRA="--script-file script.txt"
          fi
          if [ -n "$POST_TEXT" ]; then
            printf '%s' "$POST_TEXT" > post.txt
            EXTRA="--from-post post.txt"
          fi
          if [ -n "$VIDEO_STYLE" ] && [ "$VIDEO_STYLE" != "default" ]; then
            python bot/video_gen.py --style "$VIDEO_STYLE" --topic "$VIDEO_TOPIC" \
              --seconds ${{ github.event.inputs.seconds }} --out out/video_test.mp4 \
              --edl-out out/video_test.edl.json --srt-out out/video_test.srt $EXTRA
          else
            python bot/video_gen.py --seconds ${{ github.event.inputs.seconds }} --out out/video_test.mp4 $EXTRA
          fi

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video-test
          path: |
            out/video_test.mp4
            out/video_test.edl.json
            out/video_test.srt
          retention-days: 7

      # Готовое видео — админу прямо в Telegram (тест «в самом боте»:
      # команду /videotest отдают в чате, MP4 возвращается в тот же чат).
      - name: Send video to Telegram
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
            -F video="@out/video_test.mp4" \
            -F supports_streaming=true \
             -F caption="🎬 Видео готово (${{ github.event.inputs.seconds }} сек, run ${{ github.run_id }})${{ github.event.inputs.style != 'default' && ' — cinematic' || '' }}${{ github.event.inputs.script != '' && ' — по статье' || '' }}${{ github.event.inputs.from_post != '' && ' — по посту' || '' }}"
          # EDL/SRT — только для cinematic (9:16 шортсы)
          if [ -f "out/video_test.edl.json" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
              -F document="@out/video_test.edl.json" \
              -F caption="📋 Монтажный лист (EDL)"
          fi
          if [ -f "out/video_test.srt" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
              -F document="@out/video_test.srt" \
              -F caption="📝 Субтитры (SRT)"
          fi

      - name: Stop VoiceStudio
        if: always()
        run: |
          echo "=== VoiceStudio логи перед остановкой (диагностика) ==="
          docker logs voicestudio --tail 60 2>&1 || true
          docker stop voicestudio || true
          docker rm voicestudio || true

      - name: Notify failure to Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_ADMIN_CHAT_ID}\",\"text\":\"❌ Видеотест не собрался (run ${{ github.run_id }}). Смотри лог в Actions → Video test.\"}"
