name: diag-tme
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run mg_tick with real secrets (lostart slot)
        env:
          BOT_WORKER_URL: ${{ secrets.BOT_WORKER_URL }}
          BOT_WORKER_TOKEN: ${{ secrets.BOT_WORKER_TOKEN }}
          VK_TOKEN_DGC: ${{ secrets.VK_TOKEN_DGC }}
          VK_TOKEN_LOSTART: ${{ secrets.VK_TOKEN_LOSTART }}
          VK_TOKEN_LOSTLINK: ${{ secrets.VK_TOKEN_LOSTLINK }}
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'EOF'
          import sys, os
          sys.path.insert(0, 'bot'); os.chdir('bot')
          import multigroups as mg
          cfg = mg.load_mg_config()
          print("CFG_CHANNELS:", cfg["channels"])
          for g in mg.MULTI_GROUPS:
              try:
                  res = mg.publish_multi_group(g)
                  print(f"MG_RESULT {g['slug']}: {res}")
              except Exception as e:
                  print(f"MG_RESULT {g['slug']}: EXC {e}")
          EOF