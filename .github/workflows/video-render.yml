name: video-render

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Video Factory job id (from Worker KV)"
        required: true
        type: string

env:
  BOT_WORKER_URL: ${{ secrets.BOT_WORKER_URL }}
  BOT_WORKER_TOKEN: ${{ secrets.BOT_WORKER_TOKEN }}
  JOB_CALLBACK_SECRET: ${{ secrets.JOB_CALLBACK_SECRET }}
  LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  TTS_PROVIDER: ${{ secrets.TTS_PROVIDER || 'edge' }}
  VOICE_DEFAULT: ${{ secrets.VOICE_DEFAULT || 'ru-RU-DmitryNeural' }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
  TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
  STORAGE_TYPE: r2

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests certifi imageio-ffmpeg numpy edge-tts

      - name: Debug worker reachability
        run: |
          echo "BOT_WORKER_URL=[${BOT_WORKER_URL}]"
          echo "JOB_ID=[${{ github.event.inputs.job_id }}]"
          curl -sv -H "X-Bot-Auth: ${BOT_WORKER_TOKEN}" \
            "${BOT_WORKER_URL}/api/video/${{ github.event.inputs.job_id }}" 2>&1 | tail -20 || true

      - name: Run render pipeline
        id: render
        env:
          VF_JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          python -m video_factory.cli run --job-id "$VF_JOB_ID" \
            --config config/default.json --preset trustnode_news \
            --work-dir "work/$VF_JOB_ID"

      - name: Notify failure
        if: failure() && steps.render.outcome == 'failure'
        run: |
          python -m video_factory.cli callback "${{ github.event.inputs.job_id }}" failed \
            --error "render workflow failed" --config config/default.json || true