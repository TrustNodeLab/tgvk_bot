name: VK diagnose
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - run: python bot/diag_vk.py
        env:
          VK_TOKEN_LOSTART: ${{ secrets.VK_TOKEN_LOSTART }}