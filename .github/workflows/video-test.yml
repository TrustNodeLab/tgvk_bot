name: Video test (futuristic site)

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Длина видео в секундах (демо-режим; со сценарием длина = длина озвучки)"
        required: false
        default: "30"
      script:
        description: "Свой сценарий: текст/статья (пусто = демо). Разделы через '# Заголовок'"
        required: false
        default: ""
      style:
        description: "Стиль: default (скролл сайта) или cybersecurity_cinematic / cinematic / documentary / social_dynamic"
        required: false
        default: "default"
      topic:
        description: "Тема cinematic-ролика (только для engine=cine; пусто = тема по умолчанию)"
        required: false
        default: ""
      from_post:
        description: "Текст поста: GigaChat перепишет его в сценарий видео (пусто = без рерайта)"
        required: false
        default: ""

jobs:
  video:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt imageio-ffmpeg edge-tts numpy silero

      # S34: VoiceStudio — локальный TTS-сервер.
      # GPU нет → CPU-режим.
      # S34c-факт: GGUF-бинарь НЕ входит в docker-образ (zero-byte placeholder)
      #   → omnivoice-gguf даёт 503. OmniVoice full — OOM на 7GB RAM.
      # S34d: движок Sherpa-ONNX (CPU) + русская Piper-модель ru_RU-dmitri-medium.
      # S34e: sherpa требует имя файла model.onnx (не ru_RU-dmitri-medium.onnx).
      # S34f: VoiceStudio-docker падает на Piper (не передаёт vits-data-dir →
      #   "Not a model using characters as modeling unit") →
      #   вместо docker поднимаем свой мини-сервер bot/tts_server.py
      #   (тот же OpenAI-формат /v1/audio/speech, но data_dir=espeak-ng-data).
      # S34j: пользователь выбрал «ruslan p-2» — XTTS-v2 клон Piper-ruslan
      #   с питчем -2 полутона → сервер bot/tts_server_xtts.py.
      - name: Start VoiceStudio (XTTS clone ruslan p-2)
        run: |
          # 1) Стековый torch/torchaudio (CPU) — новые версии ломают XTTS
          echo "⏳ Устанавливаем torch 2.5.1 CPU..."
          pip install --quiet torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu || {
            echo "❌ не удалось поставить torch CPU"; exit 1
          }
          # 2) TTS 0.22.0 + пины (transformers 4.43.3 — BeamSearchScorer, numpy 1.26.4)
          echo "⏳ Устанавливаем TTS + зависимости..."
          pip install --quiet TTS==0.22.0 'transformers==4.43.3' imageio-ffmpeg numpy==1.26.4 sherpa-onnx || {
            echo "❌ не удалось поставить TTS/sherpa"; exit 1
          }
          # 3) Скачиваем Piper ruslan (~60MB) — это голос-донор для клонирования
          echo "⏳ Скачиваем ru_RU-ruslan-medium (~60MB) как голос-донор..."
          mkdir -p models refs
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ru_RU-ruslan-medium.tar.bz2 | tar xj -C models || {
            echo "❌ не удалось скачать модель"; exit 1
          }
          cd models/vits-piper-ru_RU-ruslan-medium
          mv ru_RU-ruslan-medium.onnx model.onnx
          mv ru_RU-ruslan-medium.onnx.json model.onnx.json
          ls -la
          cd ../..
          # 4) Референс голоса: синтез Piper'ом короткой фразы (голос ruslan)
          echo "⏳ Генерируем референс голоса (Piper ruslan)..."
          python - <<'EOF'
          import sherpa_onnx
          cfg = sherpa_onnx.OfflineTtsConfig(
              model=sherpa_onnx.OfflineTtsModelConfig(
                  vits=sherpa_onnx.OfflineTtsVitsModelConfig(
                      model="models/vits-piper-ru_RU-ruslan-medium/model.onnx",
                      tokens="models/vits-piper-ru_RU-ruslan-medium/tokens.txt",
                      lexicon="",
                      data_dir="models/vits-piper-ru_RU-ruslan-medium/espeak-ng-data",
                      dict_dir="",
                  ),
                  num_threads=4,
                  debug=False,
              ),
              rule_fsts="",
              max_num_sentences=1,
          )
          tts = sherpa_onnx.OfflineTts(cfg)
          # фраза-референс: спокойная, с интонацией (даёт XTTS тембр)
          res = tts.generate("Это голос для клонирования. Он должен звучать естественно и уверенно.", sid=0, speed=0.9)
          import numpy as np, wave
          pcm = (np.asarray(res.samples, dtype=np.float32).clip(-1, 1) * 32767).astype(np.int16)
          with wave.open("refs/ruslan.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(tts.sample_rate)
              w.writeframes(pcm.tobytes())
          print("ref bytes:", len(pcm.tobytes()))
          EOF
          ls -la refs/
          # 5) Запускаем XTTS-сервер (клон ruslan, питч -2)
          echo "⏳ Запускаем tts_server_xtts.py..."
          nohup python bot/tts_server_xtts.py --ref-audio refs/ruslan.wav --pitch -2 --port 3900 \
            > out_tts_server.log 2>&1 &
          echo "⏳ Ждём HTTP-сервер (XTTS грузится ~1 мин)..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3900/health > /dev/null 2>&1; then
              echo "✅ TTS-сервер готов (${i}x5 сек)"
              break
            fi
            sleep 5
          done
          curl -sf http://localhost:3900/health || {
            echo "❌ TTS-сервер не поднялся за 7.5 мин. Лог:"
            cat out_tts_server.log
            exit 1
          }
          echo "⏳ Тест синтеза (короткая фраза)..."
          curl -s -X POST http://localhost:3900/v1/audio/speech \
            -H "Content-Type: application/json" \
            -d '{"model":"tts-1","voice":"alloy","input":"Привет, это тест озвучки","response_format":"wav"}' \
            -o out_tts_test.wav --max-time 180
          ls -la out_tts_test.wav

      - name: Generate video
        env:
          SCRIPT_TEXT: ${{ github.event.inputs.script }}
          VIDEO_STYLE: ${{ github.event.inputs.style }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
          POST_TEXT: ${{ github.event.inputs.from_post }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gigachat
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          TTS_PROVIDER: voicestudio
          VOICESTUDIO_URL: http://localhost:3900/v1
          VOICESTUDIO_VOICE: alloy
          VOICESTUDIO_TIMEOUT: "900"
        run: |
          EXTRA=""
          if [ -n "$SCRIPT_TEXT" ]; then
            printf '%s' "$SCRIPT_TEXT" > script.txt
            EXTRA="--script-file script.txt"
          fi
          if [ -n "$POST_TEXT" ]; then
            printf '%s' "$POST_TEXT" > post.txt
            EXTRA="--from-post post.txt"
          fi
          if [ -n "$VIDEO_STYLE" ] && [ "$VIDEO_STYLE" != "default" ]; then
            python bot/video_gen.py --style "$VIDEO_STYLE" --topic "$VIDEO_TOPIC" \
              --seconds ${{ github.event.inputs.seconds }} --out out/video_test.mp4 \
              --edl-out out/video_test.edl.json --srt-out out/video_test.srt $EXTRA
          else
            python bot/video_gen.py --seconds ${{ github.event.inputs.seconds }} --out out/video_test.mp4 $EXTRA
          fi

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video-test
          path: |
            out/video_test.mp4
            out/video_test.edl.json
            out/video_test.srt
          retention-days: 7

      # Готовое видео — админу прямо в Telegram (тест «в самом боте»:
      # команду /videotest отдают в чате, MP4 возвращается в тот же чат).
      - name: Send video to Telegram
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
            -F video="@out/video_test.mp4" \
            -F supports_streaming=true \
             -F caption="🎬 Видео готово (${{ github.event.inputs.seconds }} сек, run ${{ github.run_id }})${{ github.event.inputs.style != 'default' && ' — cinematic' || '' }}${{ github.event.inputs.script != '' && ' — по статье' || '' }}${{ github.event.inputs.from_post != '' && ' — по посту' || '' }}"
          # EDL/SRT — только для cinematic (9:16 шортсы)
          if [ -f "out/video_test.edl.json" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
              -F document="@out/video_test.edl.json" \
              -F caption="📋 Монтажный лист (EDL)"
          fi
          if [ -f "out/video_test.srt" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
              -F document="@out/video_test.srt" \
              -F caption="📝 Субтитры (SRT)"
          fi

      # Автопубликация short → VK Клипы + TikTok (continue-on-error:
      # отсутствие TIKTOK_ACCESS_TOKEN / ошибки VK не валят рендер).
      - name: Publish short to VK Clips + TikTok
        if: success()
        continue-on-error: true
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_VIDEO_TOKEN: ${{ secrets.VK_VIDEO_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          python -m bot.publish_short out/video_test.mp4 \
            "短视频 публикация ${GITHUB_RUN_ID}" || true

      - name: Stop VoiceStudio
        if: always()
        run: |
          echo "=== TTS-сервер лог перед остановкой (диагностика) ==="
          cat out_tts_server.log 2>/dev/null || true
          pkill -f "tts_server" || true

      - name: Notify failure to Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_ADMIN_CHAT_ID}\",\"text\":\"❌ Видеотест не собрался (run ${{ github.run_id }}). Смотри лог в Actions → Video test.\"}"
